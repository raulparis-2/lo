<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publicaciones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header id="site-header" class="site-header"></header>

<main>
  <section class="block" style="padding-bottom:0;">
    <div class="container">
      <h1>Publicaciones</h1>
    </div>
  </section>
  <section class="block">
    <div class="container">
      <div class="grid-posts" id="posts-list"><p class="skeleton">Cargando…</p></div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/helpers.js"></script>
<script src="/assets/js/public/components.js"></script>
<script>
(async function () {
  await renderHeaderFooter("publicaciones");
  const { data: posts } = await window.supabaseClient
    .from("posts")
    .select("title, image_url, post_date, excerpt, slug")
    .eq("published", true)
    .order("post_date", { ascending: false });

  const el = document.getElementById("posts-list");
  if (!posts || posts.length === 0) {
    el.innerHTML = `<p class="empty-state">Todavía no hay publicaciones.</p>`;
    return;
  }
  el.innerHTML = posts.map(p => `
    <a class="post-card" href="/publicacion/index.html?slug=${encodeURIComponent(p.slug)}">
      <div class="post-card__image">
        ${p.image_url ? `<img src="${publicMediaUrl(p.image_url)}" alt="${escapeHtml(p.title)}" loading="lazy">` : ""}
      </div>
      <div class="post-card__date">${formatDate(p.post_date)}</div>
      <div class="post-card__title">${escapeHtml(p.title)}</div>
      ${p.excerpt ? `<div class="post-card__excerpt">${escapeHtml(p.excerpt)}</div>` : ""}
    </a>`).join("");
})();
</script>
</body>
</html>
