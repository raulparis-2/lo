<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso — Panel de contenido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/admin.css">
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">

<div class="login-shell">
  <h1>Panel de contenido</h1>
  <p class="field-hint" style="margin-bottom:1.6rem;">Accede con el email y la contraseña de administrador.</p>
  <form class="form" id="login-form">
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" required autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password">
    </div>
    <div class="form-actions">
      <button type="submit" class="btn btn--primary">Entrar</button>
    </div>
    <p id="login-status" class="field-hint"></p>
  </form>
</div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/helpers.js"></script>
<script>
(async function () {
  const { data: { session } } = await window.supabaseClient.auth.getSession();
  if (session) { window.location.href = "/admin/index.html"; return; }

  const form = document.getElementById("login-form");
  const status = document.getElementById("login-status");
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    status.textContent = "Comprobando…";
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const { error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
    if (error) {
      status.textContent = "Email o contraseña incorrectos.";
      return;
    }
    window.location.href = "/admin/index.html";
  });
})();
</script>
</body>
</html>
