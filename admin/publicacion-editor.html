<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva publicación — Panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/admin.css">
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">

<div class="admin-topbar">
  <div class="admin-topbar__brand">Panel de <span>contenido</span></div>
  <div class="admin-topbar__right">
    <a href="/" target="_blank">Ver web pública ↗</a>
    <button class="btn btn--sm" onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div class="admin-shell">
  <p class="admin-breadcrumb"><a href="/admin/index.html">Panel</a> / <a href="/admin/publicaciones.html">Publicaciones</a> / <span id="crumb-title">Nueva</span></p>
  <h1 class="admin-h1" id="page-title">Nueva publicación</h1>
  <p class="admin-sub">Escribe con el editor: sin HTML, sin Markdown.</p>

  <form class="admin-form" id="post-form" style="max-width:760px;">
    <div class="field">
      <label for="title">Título</label>
      <input type="text" id="title" required>
    </div>

    <div class="field">
      <label>Imagen de portada</label>
      <div class="image-upload">
        <div class="image-upload__preview" id="image-preview"></div>
        <input type="file" id="image-file" accept="image/*">
      </div>
    </div>

    <div class="field-row">
      <div class="field">
        <label for="post_date">Fecha</label>
        <input type="date" id="post_date">
      </div>
    </div>

    <div class="field">
      <label for="excerpt">Extracto corto</label>
      <textarea id="excerpt" placeholder="Resumen breve que se muestra en el listado."></textarea>
    </div>

    <div class="field">
      <label>Contenido</label>
      <div class="editor-toolbar" id="editor-toolbar"></div>
      <div class="editor-body" id="editor-body" contenteditable="true"></div>
    </div>

    <div class="form-actions">
      <button type="submit" data-publish="false" class="btn">Guardar borrador</button>
      <button type="submit" data-publish="true" class="btn btn--primary">Publicar</button>
      <a class="btn" href="/admin/publicaciones.html">Cancelar</a>
    </div>
  </form>
</div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/helpers.js"></script>
<script src="/assets/js/admin/auth-guard.js"></script>
<script src="/assets/js/admin/editor.js"></script>
<script>
let editingId = null;
let currentImagePath = null;

(async function () {
  const user = await requireAuth();
  if (!user) return;

  initRichEditor(document.getElementById("editor-body"), document.getElementById("editor-toolbar"), "posts");

  document.getElementById("post_date").value = new Date().toISOString().slice(0, 10);

  editingId = qs("id");
  if (editingId) {
    document.getElementById("page-title").textContent = "Editar publicación";
    document.getElementById("crumb-title").textContent = "Editar";
    document.title = "Editar publicación — Panel";

    const { data: post, error } = await window.supabaseClient.from("posts").select("*").eq("id", editingId).single();
    if (error || !post) { showToast("No se pudo cargar.", true); return; }

    document.getElementById("title").value = post.title || "";
    document.getElementById("post_date").value = post.post_date || "";
    document.getElementById("excerpt").value = post.excerpt || "";
    document.getElementById("editor-body").innerHTML = post.content || "";
    currentImagePath = post.image_url;
    if (post.image_url) {
      document.getElementById("image-preview").innerHTML = `<img src="${publicMediaUrl(post.image_url)}" alt="">`;
    }
  }
})();

document.getElementById("image-file").addEventListener("change", (e) => {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById("image-preview").innerHTML = `<img src="${URL.createObjectURL(file)}" alt="">`;
});

document.querySelectorAll("#post-form button[type=submit]").forEach(btn => {
  btn.addEventListener("click", async (e) => {
    e.preventDefault();
    const publish = btn.dataset.publish === "true";
    const form = document.getElementById("post-form");
    if (!form.checkValidity()) { form.reportValidity(); return; }

    document.querySelectorAll("#post-form button[type=submit]").forEach(b => b.disabled = true);
    const originalText = btn.textContent;
    btn.textContent = "Guardando…";

    try {
      const file = document.getElementById("image-file").files[0];
      let imagePath = currentImagePath;
      if (file) imagePath = await uploadImage(file, "posts");

      const title = document.getElementById("title").value.trim();

      const payload = {
        title,
        post_date: document.getElementById("post_date").value || null,
        excerpt: document.getElementById("excerpt").value.trim() || null,
        content: document.getElementById("editor-body").innerHTML,
        published: publish,
        image_url: imagePath
      };

      if (editingId) {
        const { error } = await window.supabaseClient.from("posts").update(payload).eq("id", editingId);
        if (error) throw error;
      } else {
        payload.slug = await uniqueSlug("posts", title);
        const { error } = await window.supabaseClient.from("posts").insert(payload);
        if (error) throw error;
      }
      showToast(publish ? "Publicación publicada." : "Borrador guardado.");
      setTimeout(() => { window.location.href = "/admin/publicaciones.html"; }, 600);
    } catch (err) {
      showToast("Error: " + err.message, true);
      document.querySelectorAll("#post-form button[type=submit]").forEach(b => b.disabled = false);
      btn.textContent = originalText;
    }
  });
});
</script>
</body>
</html>
