<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de contenido</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@300;400;500&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/style.css">
<link rel="stylesheet" href="/assets/css/admin.css">
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="admin-body">

<div class="admin-topbar">
  <div class="admin-topbar__brand">Panel de <span>contenido</span></div>
  <div class="admin-topbar__right">
    <a href="/" target="_blank">Ver web pública ↗</a>
    <button class="btn btn--sm" onclick="logout()">Cerrar sesión</button>
  </div>
</div>

<div class="admin-shell" id="panel-root">
  <p class="auth-checking">Comprobando acceso…</p>
</div>

<script src="/assets/js/config.js"></script>
<script src="/assets/js/supabase-client.js"></script>
<script src="/assets/js/helpers.js"></script>
<script src="/assets/js/admin/auth-guard.js"></script>
<script>
(async function () {
  const user = await requireAuth();
  if (!user) return;

  const root = document.getElementById("panel-root");

  const [{ count: booksCount }, { count: musicCount }, { count: postsCount }] = await Promise.all([
    window.supabaseClient.from("books").select("*", { count: "exact", head: true }),
    window.supabaseClient.from("music").select("*", { count: "exact", head: true }),
    window.supabaseClient.from("posts").select("*", { count: "exact", head: true })
  ]);

  root.innerHTML = `
    <h1 class="admin-h1">Panel de contenido</h1>
    <p class="admin-sub">Añade y edita todo lo que aparece en tu web. Los cambios se publican al instante.</p>

    <div class="panel-grid">
      <div class="panel-card">
        <div class="panel-card__icon">👤</div>
        <div class="panel-card__title">Sobre mí y configuración</div>
        <div class="panel-card__count">Nombre, biografía, foto, redes y contacto</div>
        <div class="panel-card__actions">
          <a class="btn btn--sm btn--primary" href="/admin/sobre-mi.html">Editar</a>
        </div>
      </div>

      <div class="panel-card">
        <div class="panel-card__icon">🎵</div>
        <div class="panel-card__title">Música</div>
        <div class="panel-card__count">${musicCount ?? 0} trabajo(s)</div>
        <div class="panel-card__actions">
          <a class="btn btn--sm btn--primary" href="/admin/musica-editor.html">+ Añadir trabajo</a>
          <a class="btn btn--sm" href="/admin/musica.html">Ver todos</a>
        </div>
      </div>

      <div class="panel-card">
        <div class="panel-card__icon">📚</div>
        <div class="panel-card__title">Literatura</div>
        <div class="panel-card__count">${booksCount ?? 0} obra(s)</div>
        <div class="panel-card__actions">
          <a class="btn btn--sm btn--primary" href="/admin/libro-editor.html">+ Añadir obra</a>
          <a class="btn btn--sm" href="/admin/libros.html">Ver todas</a>
        </div>
      </div>

      <div class="panel-card">
        <div class="panel-card__icon">📝</div>
        <div class="panel-card__title">Publicaciones</div>
        <div class="panel-card__count">${postsCount ?? 0} publicación(es)</div>
        <div class="panel-card__actions">
          <a class="btn btn--sm btn--primary" href="/admin/publicacion-editor.html">+ Nueva publicación</a>
          <a class="btn btn--sm" href="/admin/publicaciones.html">Ver todas</a>
        </div>
      </div>
    </div>`;
})();
</script>
</body>
</html>
